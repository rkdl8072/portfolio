<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이가이 — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@300;400;500&family=DM+Mono:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ─── NAV ─── -->
<nav id="nav">
  <a href="#" class="nav-logo">이가이</a>
  <div class="nav-right" id="nav-right">
    <span class="nav-user-name" id="nav-username" style="display:none"></span>
    <button class="nav-btn" id="nav-login-btn" onclick="openAuth('login')">로그인</button>
    <button class="nav-btn-solid" id="nav-signup-btn" onclick="openAuth('signup')">회원가입</button>
    <button class="nav-btn" id="nav-logout-btn" style="display:none" onclick="logout()">로그아웃</button>
  </div>
</nav>

<!-- ─── HERO (애니메이션은 CSS keyframes로 처리) ─── -->
<section id="hero">
  <div class="hero-line"></div>
  <p class="hero-eyebrow">Artist &amp; Illustrator</p>
  <h1 class="hero-name">이가이입니다</h1>
  <p class="hero-desc">
    안녕하세요.<br>
    색과 선으로 이야기를 쓰고,<br>보는 이에게 작은 여운을 남기고 싶습니다.
  </p>
  <div class="hero-links">
    <a href="#">Instagram</a>
    <a href="#">Behance</a>
    <a href="#">Email</a>
  </div>
  <div class="scroll-hint">
    <span>Scroll</span>
    <div class="scroll-line"></div>
  </div>
</section>

<!-- ─── RECENT SLIDER ─── -->
<!-- reveal-section: 뷰포트 진입 시 아래에서 위로 슬라이드업 -->
<section id="slider-section" class="reveal-section">
  <div class="slider-header reveal-child">
    <h2>Recent Works</h2>
    <span id="slider-count">—</span>
  </div>
  <div class="slider-track-wrap reveal-child" id="slider-wrap">
    <div class="slider-track" id="slider-track"></div>
    <button class="slider-arrow prev" id="slider-prev" onclick="slidePrev()">&#8592;</button>
    <button class="slider-arrow next" id="slider-next" onclick="slideNext()">&#8594;</button>
  </div>
  <div class="slider-dots reveal-child" id="slider-dots"></div>
</section>

<!-- ─── GALLERY ─── -->
<!-- reveal-section: 뷰포트 진입 시 아래에서 위로 슬라이드업 -->
<section id="gallery-section" class="reveal-section">
  <div class="section-header reveal-child">
    <h2 class="section-title">Works</h2>
    <div style="display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap">
      <div class="ctrl-group">
        <button class="ctrl-btn active" id="btn-mode-full" onclick="setMode('full')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="4" rx="1"/>
            <rect x="9" y="7" width="6" height="2" rx="0.5"/><rect x="1" y="9" width="14" height="2" rx="0.5"/>
          </svg>
          글과 함께
        </button>
        <button class="ctrl-btn" id="btn-mode-photo" onclick="setMode('photo')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="3" width="6" height="5" rx="1"/><rect x="9" y="3" width="6" height="5" rx="1"/>
            <rect x="1" y="10" width="6" height="3" rx="1"/><rect x="9" y="10" width="6" height="3" rx="1"/>
          </svg>
          사진만
        </button>
      </div>
      <div class="ctrl-group">
        <button class="ctrl-btn" id="btn-size-1" onclick="setGrid(1)" title="크게보기">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1.5"/></svg>
        </button>
        <button class="ctrl-btn active" id="btn-size-3" onclick="setGrid(3)" title="보통">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="1" width="4" height="4" rx="0.8"/><rect x="6" y="1" width="4" height="4" rx="0.8"/><rect x="11" y="1" width="4" height="4" rx="0.8"/>
            <rect x="1" y="7" width="4" height="4" rx="0.8"/><rect x="6" y="7" width="4" height="4" rx="0.8"/><rect x="11" y="7" width="4" height="4" rx="0.8"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="btn-size-2" onclick="setGrid(2)" title="두칸">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="1" width="6.5" height="6.5" rx="1"/><rect x="8.5" y="1" width="6.5" height="6.5" rx="1"/>
            <rect x="1" y="8.5" width="6.5" height="6.5" rx="1"/><rect x="8.5" y="8.5" width="6.5" height="6.5" rx="1"/>
          </svg>
        </button>
      </div>
      <button class="upload-btn" onclick="openUpload()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="12" x2="8" y2="4"/><polyline points="4,8 8,4 12,8"/>
          <line x1="2" y1="14" x2="14" y2="14"/>
        </svg>
        업로드
      </button>
    </div>
  </div>
  <div id="gallery-grid" class="layout-grid-3 mode-full"></div>
</section>

<!-- ─── FOOTER ─── -->
<footer class="reveal-section">
  <p>© 2025 이가이 — All rights reserved</p>
  <p>Portfolio</p>
</footer>

<!-- ─── LIGHTBOX ─── -->
<div id="lightbox" onclick="closeLightbox(event)">
  <button class="lb-close" onclick="closeLightbox(null,true)">×</button>
  <div class="lb-inner">
    <div class="lb-img"><img id="lb-img-el" src="" alt=""></div>
    <div class="lb-info">
      <p class="lb-date" id="lb-date"></p>
      <h2 class="lb-title" id="lb-title"></h2>
      <p class="lb-desc" id="lb-desc"></p>
      <div class="lb-comments">
        <h4>댓글</h4>
        <div class="comment-list" id="comment-list"></div>
        <div id="comment-form-wrap"></div>
      </div>
    </div>
  </div>
</div>

<!-- ─── UPLOAD MODAL ─── -->
<div class="modal-overlay" id="upload-modal" onclick="closeUpload(event)">
  <div class="modal-box">
    <h3>새 작품 올리기</h3>
    <div class="form-group">
      <label>이미지</label>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21,15 16,10 5,21"/>
        </svg>
        <p>클릭하거나 이미지를 드래그하세요</p>
      </div>
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="previewFile(this)">
      <img id="preview-img" alt="미리보기">
    </div>
    <div class="form-group">
      <label>제목</label>
      <input type="text" id="input-title" placeholder="작품 제목">
    </div>
    <div class="form-group">
      <label>설명 (선택)</label>
      <textarea id="input-desc" placeholder="작품에 대한 이야기를 적어주세요..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeUpload(null,true)">취소</button>
      <button class="btn-submit" onclick="submitWork()">올리기</button>
    </div>
  </div>
</div>

<!-- ─── EDIT MODAL ─── -->
<div class="modal-overlay" id="edit-modal" onclick="closeEdit(event)">
  <div class="modal-box">
    <h3>작품 수정</h3>
    <div class="form-group">
      <label>이미지 변경 (선택)</label>
      <div class="drop-zone" id="edit-drop-zone" onclick="document.getElementById('edit-file-input').click()">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21,15 16,10 5,21"/>
        </svg>
        <p>클릭하거나 이미지를 드래그하세요</p>
      </div>
      <input type="file" id="edit-file-input" accept="image/*" style="display:none" onchange="previewEditFile(this)">
      <img id="edit-preview-img" alt="미리보기">
    </div>
    <div class="form-group">
      <label>제목</label>
      <input type="text" id="edit-title" placeholder="작품 제목">
    </div>
    <div class="form-group">
      <label>설명 (선택)</label>
      <textarea id="edit-desc" placeholder="작품에 대한 이야기를 적어주세요..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEdit(null,true)">취소</button>
      <button class="btn-submit" onclick="submitEdit()">저장</button>
    </div>
  </div>
</div>

<!-- ─── AUTH MODAL ─── -->
<div class="modal-overlay" id="auth-modal" onclick="closeAuth(event)">
  <div class="modal-box">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">로그인</div>
      <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">회원가입</div>
    </div>
    <!-- Login -->
    <div id="form-login">
      <div class="form-group">
        <label>아이디</label>
        <input type="text" id="login-id" placeholder="아이디를 입력하세요" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <p class="form-error" id="login-error"></p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeAuth(null,true)">취소</button>
        <button class="btn-submit" onclick="doLogin()">로그인</button>
      </div>
    </div>
    <!-- Signup -->
    <div id="form-signup" style="display:none">
      <div class="form-group">
        <label>아이디</label>
        <input type="text" id="signup-id" placeholder="사용할 아이디를 입력하세요">
      </div>
      <div class="form-group">
        <label>닉네임</label>
        <input type="text" id="signup-name" placeholder="이름 또는 닉네임">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="signup-pw" placeholder="비밀번호 (6자 이상)">
      </div>
      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" id="signup-pw2" placeholder="비밀번호를 다시 입력하세요" onkeydown="if(event.key==='Enter')doSignup()">
      </div>
      <p class="form-error" id="signup-error"></p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeAuth(null,true)">취소</button>
        <button class="btn-submit" onclick="doSignup()">가입하기</button>
      </div>
    </div>
  </div>
</div>

<!-- Admin toggle -->
<button class="admin-toggle" id="admin-btn" onclick="toggleAdminMode()">관리</button>

<script src="main.js"></script>
</body>
</html>
